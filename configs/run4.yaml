# Run 4: prompt v1 + oversampling + checkpoint chosen by val macro-F1.
# Completes the 2x2 ablation {prompt v1, v2} x {oversampling off, on} with runs 1-3 (docs/runs.md attempt 9).
run_name: run4-v1prompt-oversample-f1select
model_id: Qwen/Qwen2.5-1.5B-Instruct
prompt_version: v1
max_len: 1024
seed: 42
select_by: val_macro_f1
eval_repetition_penalty: 1.1   # same decoding as runs 1-3 so the ablation table is comparable (D-020)
run_baseline: false            # zero-shot v1 at repetition_penalty 1.1 already exists (run 1)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 3
  lr: 2.0e-4
  per_device_batch_size: 4
  grad_accum: 4
  warmup_ratio: 0.05
  weight_decay: 0.0
  lr_scheduler: cosine
  gradient_checkpointing: true
  fp16: true
  logging_steps: 5
  oversample:
    target: 60
    max_factor: 4
  save_total_limit: null

wandb_project: trialspec-lm
hub_repo: umairishuman/trialspec-qwen2.5-1.5b-lora-run4
